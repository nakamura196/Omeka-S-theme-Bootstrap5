[info]
name = "Bootstrap5 Modernized"
version = "2.0.0"
author = "Satoru Nakamura"
description = "Modern Omeka S theme with Bootstrap 5, featuring responsive search interface, grid/list view toggle, modernized item display, and enhanced metadata presentation"
theme_link = "https://github.com/nakamura196/omeka-s-bootstrap5-theme"
author_link = "https://github.com/nakamura196"
omeka_version_constraint = "^4.1.0"
has_translations = "true"

[config]
elements.footer.name = "footer"
elements.footer.attributes.id = "footer"
elements.footer.type = "Omeka\Form\Element\HtmlTextarea"
elements.footer.options.label = "Footer Content"
elements.footer.options.info = "HTML content to appear in the footer"
elements.footer.attributes.value = "Powered by Omeka S"

; Hero section settings
elements.hero_image.name = "hero_image"
elements.hero_image.type = "Omeka\Form\Element\Asset"
elements.hero_image.options.label = "Hero Background Image"
elements.hero_image.options.info = "Background image for the hero section"

elements.hero_button_url.name = "hero_button_url"
elements.hero_button_url.type = "Text"
elements.hero_button_url.options.label = "Hero Button URL"
elements.hero_button_url.options.info = "URL for the hero section button (leave empty to hide button)"

elements.hero_button_text.name = "hero_button_text"
elements.hero_button_text.type = "Text"
elements.hero_button_text.options.label = "Hero Button Text"
elements.hero_button_text.options.info = "Text for the hero section button"
elements.hero_button_text.attributes.value = "Explore Collections"

resource_page_regions.items.main = "Main"
resource_page_regions.item_sets.main = "Main"
resource_page_regions.media.main = "Main"

resource_page_blocks.items.main[] = "mediaEmbeds"
resource_page_blocks.items.main[] = "values"
resource_page_blocks.items.main[] = "itemSets"
resource_page_blocks.items.main[] = "sitePages"
resource_page_blocks.items.main[] = "mediaList"
resource_page_blocks.items.main[] = "linkedResources"
resource_page_blocks.item_sets.main[] = "values"
resource_page_blocks.media.main[] = "mediaRender"
resource_page_blocks.media.main[] = "values"

block_templates.asset.asset-3-grid = "3 column grid"
block_templates.media.media-card = "2 column cards"