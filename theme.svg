<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Header/Navbar -->
  <rect width="800" height="60" fill="#0d6efd" />
  
  <!-- Header content -->
  <text x="20" y="40" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Bootstrap5 Modernized</text>
  <rect x="650" y="20" width="120" height="20" rx="10" fill="rgba(255,255,255,0.2)" />
  
  <!-- Hero section -->
  <rect x="0" y="60" width="800" height="120" fill="linear-gradient(135deg, #0d6efd 0%, #6f42c1 100%)"/>
  <text x="50" y="110" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Modern Omeka S Theme</text>
  <text x="50" y="140" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="14">Responsive • Bootstrap 5 • Mobile-First</text>
  
  <!-- Search bar -->
  <rect x="50" y="200" width="700" height="40" rx="20" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="70" y="225" fill="#6c757d" font-family="Arial, sans-serif" font-size="14">🔍 Search collections...</text>
  <rect x="680" y="210" width="60" height="20" rx="10" fill="#28a745"/>
  <text x="695" y="223" fill="white" font-family="Arial, sans-serif" font-size="10">Search</text>
  
  <!-- Content grid -->
  <g transform="translate(50, 270)">
    <!-- Sidebar (facets) -->
    <rect width="180" height="250" fill="white" rx="8" stroke="#dee2e6" stroke-width="1"/>
    <rect x="15" y="15" width="150" height="25" rx="4" fill="#0d6efd"/>
    <text x="25" y="32" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Filters</text>
    
    <!-- Facet items -->
    <rect x="15" y="50" width="150" height="15" rx="3" fill="#e9ecef"/>
    <rect x="15" y="75" width="120" height="15" rx="3" fill="#e9ecef"/>
    <rect x="15" y="100" width="140" height="15" rx="3" fill="#e9ecef"/>
    
    <!-- Main content area -->
    <g transform="translate(200, 0)">
      <!-- Grid toggle buttons -->
      <rect x="400" y="15" width="30" height="25" rx="4" fill="#0d6efd"/>
      <rect x="440" y="15" width="30" height="25" rx="4" fill="#e9ecef"/>
      
      <!-- Grid icons -->
      <g fill="white">
        <rect x="408" y="23" width="3" height="3"/>
        <rect x="413" y="23" width="3" height="3"/>
        <rect x="418" y="23" width="3" height="3"/>
        <rect x="408" y="28" width="3" height="3"/>
        <rect x="413" y="28" width="3" height="3"/>
        <rect x="418" y="28" width="3" height="3"/>
      </g>
      
      <g fill="#6c757d">
        <rect x="448" y="25" width="14" height="2"/>
        <rect x="448" y="29" width="10" height="2"/>
        <rect x="448" y="33" width="12" height="2"/>
      </g>
      
      <!-- Result cards in grid layout -->
      <g>
        <!-- Card 1 -->
        <rect x="0" y="60" width="145" height="120" rx="8" fill="white" stroke="#dee2e6" stroke-width="1"/>
        <rect x="10" y="70" width="125" height="60" rx="4" fill="#f8f9fa"/>
        <rect x="10" y="140" width="100" height="8" rx="4" fill="#e9ecef"/>
        <rect x="10" y="155" width="80" height="6" rx="3" fill="#f8f9fa"/>
        
        <!-- Card 2 -->
        <rect x="165" y="60" width="145" height="120" rx="8" fill="white" stroke="#dee2e6" stroke-width="1"/>
        <rect x="175" y="70" width="125" height="60" rx="4" fill="#f8f9fa"/>
        <rect x="175" y="140" width="110" height="8" rx="4" fill="#e9ecef"/>
        <rect x="175" y="155" width="90" height="6" rx="3" fill="#f8f9fa"/>
        
        <!-- Card 3 -->
        <rect x="330" y="60" width="145" height="120" rx="8" fill="white" stroke="#dee2e6" stroke-width="1"/>
        <rect x="340" y="70" width="125" height="60" rx="4" fill="#f8f9fa"/>
        <rect x="340" y="140" width="85" height="8" rx="4" fill="#e9ecef"/>
        <rect x="340" y="155" width="95" height="6" rx="3" fill="#f8f9fa"/>
      </g>
      
      <!-- Pagination -->
      <g transform="translate(150, 200)">
        <rect x="0" y="0" width="80" height="30" rx="15" fill="white" stroke="#dee2e6" stroke-width="1"/>
        <text x="15" y="20" fill="#6c757d" font-family="Arial, sans-serif" font-size="11">1 / 25 pages</text>
        
        <rect x="95" y="5" width="20" height="20" rx="4" fill="#0d6efd"/>
        <text x="102" y="18" fill="white" font-family="Arial, sans-serif" font-size="10">‹</text>
        
        <rect x="125" y="5" width="20" height="20" rx="4" fill="#0d6efd"/>
        <text x="132" y="18" fill="white" font-family="Arial, sans-serif" font-size="10">›</text>
      </g>
    </g>
  </g>
  
  <!-- Footer -->
  <rect x="0" y="550" width="800" height="50" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="350" y="580" fill="#6c757d" font-family="Arial, sans-serif" font-size="12">Powered by Omeka S</text>
  
  <!-- Design elements -->
  <circle cx="750" cy="30" r="15" fill="rgba(255,255,255,0.2)"/>
  <circle cx="720" cy="30" r="15" fill="rgba(255,255,255,0.2)"/>
  <circle cx="690" cy="30" r="15" fill="rgba(255,255,255,0.2)"/>
</svg>
